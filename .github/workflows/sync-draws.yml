name: sync-draws

on:
  schedule:
    # 北京 20:00–23:50 每 10 分钟触发一次。
    # GitHub 免费调度器会把定时任务推迟 5–8 小时，所以：
    #   1) 脚本自己会"等到 20:40 再轮询"，跑到的这一次就能覆盖整晚；
    #   2) 本工作流**自己部署 Pages**（关键修复：
    #      用 GITHUB_TOKEN 提交的 push 不会触发别的 workflow，
    #      之前的架构里数据进了仓库、站点却一直不更新）。
    - cron: '*/10 12-15 * * *'
    # 白天兜底：万一夜里全被跳过，白天还能补上
    - cron: '40 0-11/4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-draws
  # 新一轮触发会取消还在轮询的旧一轮：旧的那次即使跑完也是过期信息
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 关键路径：只要号码。500.com 静态 XML / 17500 明文，两个独立源互为兜底。
      # --wait-draw 只在定时触发时生效：提前跑到就等到 20:40，然后在开奖窗口内每 4 分钟重试，
      # 直到"今晚该出的期次"都到齐（否则等到 23:56 结束）。
      - name: Fetch draw numbers (fast path)
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/sync-numbers.js --days 45 --wait-draw
          else
            node scripts/sync-numbers.js --days 45
          fi

      - name: Fetch official draws (best effort)
        continue-on-error: true
        run: |
          echo "官方接口对 GitHub Runner 返回 403（网宿 WAF 按 IP 拦），这一步通常失败，失败不影响后续。"
          node scripts/sync-to-json.js --count 60 --backfill 0 --keep 3000

      - name: Fetch 500.com HTML fallback
        continue-on-error: true
        run: |
          # 号码已由快通道补上；这一步只为补齐奖级明细
          node scripts/sync-thirdparty.js --keep 3000

      - name: Enrich (福运奖状态 / 派奖金额)
        continue-on-error: true
        run: |
          # 福运奖启停按规则第十八条用奖池推导；派奖金额只在公告页 HTML（Runner 403 时跳过）
          node scripts/enrich-draws.js

      - name: Report latest issue
        run: |
          node -e "
          for (const g of ['ssq','kl8']) {
            const p = require('./web/data/draws/'+g+'.json');
            const r = p.records[0];
            console.log(g, p.records.length + ' 期，最新 ' + r.issue + '（' + r.drawDate + '）');
          }"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%Y-%m-%d)"
            git push
          fi

      # 下面三步是这次修复的核心：GITHUB_TOKEN 推的提交不会触发 deploy-pages，
      # 所以必须在本工作流里直接构建并发布，否则"仓库更新、站点不动"。
      - name: Build static bundle
        run: node scripts/build-web.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 与 deploy-pages.yml 共用同一个 concurrency 组，避免两边同时发布
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
