name: sync-draws

on:
  schedule:
    # UTC 01:00 / 14:00 = 北京时间 09:00 / 22:00
    # 双色球 21:15 开奖、快乐8 每日开奖，22:00 抓当天，次日 09:00 兜底补抓
    - cron: '0 1,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official draws into web/data
        run: node scripts/sync-to-json.js --count 60 --keep 300

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%Y-%m-%d)"
            git push
          fi
