name: sync-draws

on:
  schedule:
    # GitHub 的免费调度器会把高频 cron 合并/延迟（实测 hourly 只跑成 5 次/天，
    # 延迟 5–8 小时），所以把「火力」集中在开奖后的两小时窗口里：
    # 13:10–15:50 UTC = 北京 21:10–23:50，双色球 21:15、快乐8 21:30 都已过。
    - cron: '*/10 13-15 * * *'
    # 白天兜底：万一晚上全被跳过，白天还能补上（每 4 小时一次）
    - cron: '40 0-12/4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 关键路径：只要号码。500.com 的静态 XML 在 Runner 上可直连，
      # 一次请求拿到全量期号 + 号码 + 开奖日期，不依赖官方公告页。
      - name: Fetch draw numbers (fast path)
        run: |
          node scripts/sync-numbers.js --days 45

      - name: Fetch official draws (best effort)
        continue-on-error: true
        run: |
          echo "官方接口对 GitHub Runner 返回 403（网宿 WAF 按 IP 拦），这一步通常失败，失败不影响后续。"
          node scripts/sync-to-json.js --count 60 --backfill 0 --keep 3000

      - name: Fetch 500.com HTML fallback
        continue-on-error: true
        run: |
          # 号码已由 XML 补上；这一步只为补齐官方页面里的奖级明细
          node scripts/sync-thirdparty.js --keep 3000

      - name: Enrich (福运奖状态 / 派奖金额)
        continue-on-error: true
        run: |
          # 福运奖启停按规则第十八条用奖池推导；派奖金额只存在于公告页 HTML（Runner 403 时跳过）
          node scripts/enrich-draws.js

      - name: Report latest issue
        run: |
          node -e "
          for (const g of ['ssq','kl8']) {
            const p = require('./web/data/draws/'+g+'.json');
            const r = p.records[0];
            console.log(g, p.records.length + ' 期，最新 ' + r.issue + '（' + r.drawDate + '）');
          }"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%Y-%m-%d)"
            git push
          fi
