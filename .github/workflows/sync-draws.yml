name: sync-draws

on:
  schedule:
    # UTC 13:50 = 北京时间 21:50
    # 双色球 21:15 开奖、快乐8 21:30 开奖，21:50 两彩种公告都已出
    - cron: '50 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official draws (best effort)
        continue-on-error: true
        run: |
          echo "官方接口对 GitHub Runner 返回 403（网宿 WAF 按 IP 拦），这一步通常失败，失败不影响后续。"
          node scripts/sync-to-json.js --count 60 --backfill 0 --keep 3000

      - name: Fetch third-party fallback (500.com)
        run: |
          # 官方拿不到时用 500.com 兜底；已存在的官方记录不会被覆盖
          node scripts/sync-thirdparty.js --keep 3000

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%Y-%m-%d)"
            git push
          fi
