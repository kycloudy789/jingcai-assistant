name: sync-draws

on:
  schedule:
    # 每小时 :50 尝试一次（UTC）。13:50 UTC = 北京 21:50，是目标时间；
    # 其余 23 次是兜底：GitHub 的免费定时器实测会把任务延迟 4.5–18 小时，
    # 只排一次的话经常整天不跑。脚本幂等，没新数据不会产生提交。
    - cron: '50 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-draws
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch official draws (best effort)
        continue-on-error: true
        run: |
          echo "官方接口对 GitHub Runner 返回 403（网宿 WAF 按 IP 拦），这一步通常失败，失败不影响后续。"
          node scripts/sync-to-json.js --count 60 --backfill 0 --keep 3000

      - name: Fetch third-party fallback (500.com)
        run: |
          # 官方拿不到时用 500.com 兜底；已存在的官方记录不会被覆盖
          node scripts/sync-thirdparty.js --keep 3000

      - name: Enrich (福运奖状态 / 派奖金额)
        run: |
          # 福运奖启停按规则第十八条用奖池推导；派奖金额只存在于公告页 HTML
          node scripts/enrich-draws.js

      - name: Report latest issue
        run: |
          node -e "
          for (const g of ['ssq','kl8']) {
            const p = require('./web/data/draws/'+g+'.json');
            console.log(g, p.records.length + ' 期，最新 ' + (p.records[0] ? p.records[0].issue : '—'));
          }"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore(data): 同步开奖数据 $(date -u +%Y-%m-%d)"
            git push
          fi
